name: MIXTAPE firmware

on:
  push:
    paths:
      - 'firmware/chompi-tape/**'
      - '.github/workflows/tape-firmware.yml'
  pull_request:
    paths:
      - 'firmware/chompi-tape/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # libDaisy only supports this version, newer ones overflow SRAM
      - uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: '10.3-2021.10'

      - name: Build every pushed commit
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          commits=$GITHUB_SHA
          if [ "$EVENT" = push ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            commits=$(git rev-list --reverse "$BEFORE..$GITHUB_SHA")
          fi

          mkdir -p out
          for c in $commits; do
            git checkout -q "$c"
            make -C firmware/chompi-tape/code/src clean
            make -C firmware/chompi-tape/code/src -j"$(nproc)"

            short=$(git rev-parse --short "$c")
            bin="out/CHOMPI_MIXTAPE_$short.bin"
            cp firmware/chompi-tape/code/src/build/CHOMPI.bin "$bin"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: mixtape-firmware
          path: out/*.bin

      # the last commit built is the pushed one, its firmware goes on the site
      - uses: actions/setup-node@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: firmware/chompi-tape/site/package-lock.json

      - name: Build the site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: firmware/chompi-tape/site
        run: |
          export FIRMWARE_SHA=$(git rev-parse --short HEAD) FIRMWARE_DATE=$(git log -1 --format=%cs)
          mkdir -p public && cp ../code/src/build/CHOMPI.bin "public/CHOMPI_MIXTAPE_$FIRMWARE_SHA.bin"
          npm ci
          npm run build

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: firmware/chompi-tape/site/dist

  pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
