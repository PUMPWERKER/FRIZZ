<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 248" width="480" height="248" role="img" aria-labelledby="title desc">
<title id="title">The loop pages' keys</title>
<desc id="desc">The Loops and Cubbi pages' keys. SHIFT + lower C#: open the Loops page; again, back to the play page. SHIFT + lower D#: open the Cubbi page; again, back to the play page. SHIFT tap SHIFT tap: back to the play page, from either. SHIFT + white key N taps: its loop at the end of the N-th pass.</desc>
<style>svg{font-size:12px}text{font-family:'IBM Plex Mono', ui-monospace, Menlo, monospace;fill:#EEEBE3;text-anchor:middle}.m,.sn{font-family:'IBM Plex Sans', system-ui, sans-serif}.m.mo{font-family:'IBM Plex Mono', ui-monospace, Menlo, monospace}.as{text-anchor:start}.ae{text-anchor:end}.m{fill:#A9A49A}.gt{fill:#1B1B19}.b{fill:none;stroke:#A9A49A;stroke-width:1.5}.bx{fill:none;stroke:#A9A49A;stroke-width:2}.ba{fill:#26261F;stroke:#EEEBE3;stroke-width:2}.la{fill:none;stroke:#EEEBE3;stroke-width:2}.ls{fill:none;stroke:#A9A49A;stroke-width:2}.lc{fill:none;stroke:#77736B;stroke-width:1.5;stroke-dasharray:5 4}.da{fill:#EEEBE3}.ds{fill:#A9A49A}.sw{stroke:#EEEBE3;stroke-width:2}.g{fill:#EEEBE3}.j{fill:#A9A49A}.wk{fill:#EEEBE3;stroke:#1B1B19;stroke-width:1.5}.dk{fill:#26261F;stroke:#A9A49A;stroke-width:1.5}.sk{fill:#A9A49A;stroke:#1B1B19;stroke-width:1.5}.led{fill:none;stroke:#A9A49A;stroke-width:1.5}</style>
<defs><marker id="ma" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0L10,5L0,10z" fill="#EEEBE3"/></marker><marker id="ms" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0L10,5L0,10z" fill="#A9A49A"/></marker><marker id="mc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0L10,5L0,10z" fill="#77736B"/></marker></defs>
<rect width="480" height="248" fill="#1B1B19"/>
<rect x="20" y="15" width="51" height="26" class="ba"/>
<text x="45.5" y="32.5" class="t" font-size="11" font-weight="600">SHIFT</text>
<text x="84" y="33" class="t" font-size="14" font-weight="600">+</text>
<rect x="99" y="15" width="70.8" height="26" class="dk"/>
<text x="134.4" y="32.5" class="t" font-size="11" font-weight="600">lower C#</text>
<text x="20" y="58" class="m as">Open the Loops page; again, back to the play page.</text>
<rect x="20" y="73" width="51" height="26" class="ba"/>
<text x="45.5" y="90.5" class="t" font-size="11" font-weight="600">SHIFT</text>
<text x="84" y="91" class="t" font-size="14" font-weight="600">+</text>
<rect x="99" y="73" width="70.8" height="26" class="dk"/>
<text x="134.4" y="90.5" class="t" font-size="11" font-weight="600">lower D#</text>
<text x="20" y="116" class="m as">Open the Cubbi page; again, back to the play page.</text>
<rect x="20" y="131" width="51" height="26" class="ba"/>
<text x="45.5" y="148.5" class="t" font-size="11" font-weight="600">SHIFT</text>
<text x="79" y="148.5" class="m as">tap</text>
<rect x="105.5" y="131" width="51" height="26" class="ba"/>
<text x="131" y="148.5" class="t" font-size="11" font-weight="600">SHIFT</text>
<text x="164.5" y="148.5" class="m as">tap</text>
<text x="20" y="174" class="m as">Back to the play page, from either.</text>
<rect x="20" y="189" width="51" height="26" class="ba"/>
<text x="45.5" y="206.5" class="t" font-size="11" font-weight="600">SHIFT</text>
<text x="84" y="207" class="t" font-size="14" font-weight="600">+</text>
<rect x="99" y="189" width="77.4" height="26" class="wk"/>
<text x="137.7" y="206.5" class="gt" font-size="11" font-weight="600">white key</text>
<text x="184.4" y="206.5" class="m as">N taps</text>
<text x="20" y="232" class="m as">Its loop at the end of the N-th pass.</text>
