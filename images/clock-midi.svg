<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 690" width="720" height="690" role="img" aria-labelledby="title desc">
<title id="title">FRIZZ clock and MIDI</title>
<desc id="desc">Where the tempo comes from and where MIDI goes. MIDI comes in over TRS and USB. The clock source (A) picks whose clock counts, the clock factor (B) follows it at half or double. That clock quantizes recordings in the looper. Start, Stop, Continue and Song Position from the chosen input move the loop when transport following (C) is on. The tempo clock takes the first of: the loop, the MIDI clock, the tapped or last tempo; it drives the effects that follow a tempo, the scene morphs' bar lines, the beat LEDs and MIDI out. MIDI out (D) sends the clock, generated or passed on, the loop's transport and, with feedback (E), the panel's changes as CCs, over TRS or TRS and USB.</desc>
