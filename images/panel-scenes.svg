<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 273" width="480" height="273" role="img" aria-labelledby="title desc">
<title id="title">FX scenes</title>
<desc id="desc">The panel with the scene keys lit: the five dark keys in the middle, the blank scene and scenes 1 to 4; the last three dark keys, save in green, copy in blue, delete in red; and the CHOMPI key. A scene key: recall it. The first is the blank scene, then 1–4. Save, copy or delete (green, blue, red): tap one, then the slot (for copy, the source, then the destination), then CHOMPI to confirm. White: done.</desc>
