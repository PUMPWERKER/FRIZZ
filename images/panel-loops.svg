<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 313" width="480" height="313" role="img" aria-labelledby="title desc">
<title id="title">The Loops page</title>
<desc id="desc">The panel on the Loops page, in bank B: the CHOMPI key glows yellow, bank B's colour; the lower C# is orange, leading to bank A, the lower D# green, leading to bank C; white keys 1 to 9 hold loops, dim yellow, key 3 bright, the loop playing. CHOMPI glows in the bank's colour; hold it as SHIFT for the gestures: SHIFT + lower C# opens and closes the page. Lower C#, lower D#: the bank before, after, in its colour. A white key: its loop, at once. SHIFT + the key: at the end of the pass, tapped N times at the end of the N-th.</desc>
