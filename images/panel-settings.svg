<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 379" width="480" height="379" role="img" aria-labelledby="title desc">
<title id="title">The settings page</title>
<desc id="desc">The panel on the settings page, the mode switch up: the white keys pick the MIDI channel, dim light blue, key 15 white for channel 16; the ten dark keys set the rest, each lit in its own colour; knob 1 sets the LED brightness. L.ower C#: every channel L.ower D#: effects over TRS L.ower F#: transport L.ower G#: clock factor, beat L.ower A#: clock source U.pper C#: MIDI out U.pper D#: MIDI feedback U.pper F#: AUX, the mic or USB U.pper G#: monitoring U.pper A#: through the effects White keys: the MIDI channel, 1 to 15; key 15 again: 16. Knob 1: the LED brightness. The mode switch: up for this page, down to play.</desc>
