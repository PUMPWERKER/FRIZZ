<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" width="480" height="480" role="img" aria-labelledby="title desc">
<title id="title">Key combinations</title>
<desc id="desc">The gestures to know, as keys. hold FX key then SHIFT: latch the effect on, or off again. SHIFT then FX key: latch it too: the order doesn't matter. SHIFT + LOOP 3 taps or more: tap the tempo. hold PLAY + LOOP: record in time with the clock; with a loop, erase at its end. SHIFT + VOLUME turn: the input/loop mix. SHIFT + scene key let go: morph to the scene on the bar line. SHIFT + VOLUME hold 2 s: on the settings page: write a bug report. SHIFT + LOOP hold 2 s: on the settings page: lend the card to the computer.</desc>
