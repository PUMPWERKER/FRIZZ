<text x="90.8" y="323" class="t" font-size="15" font-weight="bold">+</text>
<rect x="105.8" y="305" width="78.3" height="26" rx="3" class="dk"/>
<text x="145" y="322.5" class="t" font-size="12" font-weight="bold">scene key</text>
<text x="189.2" y="322.5" class="m as" font-size="12">let go</text>
<text x="20" y="348" class="m as" font-size="12">Morph to the scene on the bar line.</text>
<rect x="20" y="363" width="57.8" height="26" rx="3" class="ba"/>
<text x="48.9" y="380.5" class="t" font-size="12" font-weight="bold">SHIFT</text>
<text x="90.8" y="381" class="t" font-size="15" font-weight="bold">+</text>
<rect x="105.8" y="363" width="71.9" height="26" rx="13" class="b"/>
<text x="141.8" y="380.5" class="t" font-size="12" font-weight="bold">VOLUME</text>
<text x="182.7" y="380.5" class="m as" font-size="12">hold 2 s</text>
<text x="20" y="406" class="m as" font-size="12">On the settings page: write a bug report.</text>
