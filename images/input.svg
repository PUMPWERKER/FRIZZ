<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 720" width="720" height="720" role="img" aria-labelledby="title desc">
<title id="title">FRIZZ input</title>
<desc id="desc">The input. AUX (stereo, or mono: its left to both sides), the built-in mic and USB (a computer's audio) each have their own input gain; AUX is then amplified 3× and its DC taken out, the mic 5×, DC blocked, highpassed at about 150 Hz and the same on both sides, USB 3× as AUX. Switch A (upper F#, or the AUX jack between AUX and the mic) picks the source, with a 5 ms crossfade. The source goes as it is to the looper and to the headphone feed. Switch B (upper G#), its monitoring, has it on the outputs or not, switch C (upper A#) sends it through the effects or past them. The input/loop mix sets the input's share against the loop's; the share past the effects joins after the finalizer, before VOLUME.</desc>
<style>svg{font-size:12px}text{font-family:'IBM Plex Mono', ui-monospace, Menlo, monospace;fill:#EEEBE3;text-anchor:middle}.as{text-anchor:start}.ae{text-anchor:end}.m{fill:#A9A49A}.gt{fill:#1B1B19}.b{fill:none;stroke:#A9A49A;stroke-width:1.5}.bx{fill:none;stroke:#A9A49A;stroke-width:2}.ba{fill:#26261F;stroke:#EEEBE3;stroke-width:2}.la{fill:none;stroke:#EEEBE3;stroke-width:2}.ls{fill:none;stroke:#A9A49A;stroke-width:2}.lc{fill:none;stroke:#77736B;stroke-width:1.5;stroke-dasharray:5 4}.da{fill:#EEEBE3}.ds{fill:#A9A49A}.sw{stroke:#EEEBE3;stroke-width:2}.g{fill:#EEEBE3}.j{fill:#A9A49A}.wk{fill:#EEEBE3;stroke:#1B1B19;stroke-width:1.5}.dk{fill:#26261F;stroke:#A9A49A;stroke-width:1.5}.sk{fill:#A9A49A;stroke:#1B1B19;stroke-width:1.5}.led{fill:none;stroke:#A9A49A;stroke-width:1.5}</style>
<defs><marker id="ma" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0L10,5L0,10z" fill="#EEEBE3"/></marker><marker id="ms" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0L10,5L0,10z" fill="#A9A49A"/></marker><marker id="mc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0L10,5L0,10z" fill="#77736B"/></marker></defs>
<rect width="720" height="720" fill="#1B1B19"/>
<circle cx="28" cy="90" r="5" class="b"/>
<text x="20" y="72" class="t as" font-weight="600">AUX IN</text>
<polyline points="33,90 70,90" class="la" marker-end="url(#ma)"/>
<rect x="70" y="66" width="90" height="48" class="bx"/>
<text x="115" y="86.5" class="t" font-weight="600">STEREO</text>
<text x="115" y="102.5" class="m" font-size="11">or mono</text>
<rect x="151" y="57" width="18" height="18" class="g"/>
<text x="160" y="70.5" class="gt" font-size="11" font-weight="600">M</text>
<polyline points="160,90 185,90" class="la" marker-end="url(#ma)"/>
<rect x="185" y="66" width="100" height="48" class="bx"/>
<text x="235" y="86.5" class="t" font-weight="600">INPUT GAIN</text>
<text x="235" y="102.5" class="m" font-size="11">AUX's own</text>
<polyline points="285,90 310,90" class="la" marker-end="url(#ma)"/>
<rect x="310" y="66" width="100" height="48" class="bx"/>
<text x="360" y="86.5" class="t" font-weight="600">× 3</text>
<text x="360" y="102.5" class="m" font-size="11">DC block</text>
<polyline points="410,90 550,90 550,125 562,125" class="la"/>
<circle cx="28" cy="190" r="5" class="b"/>
<text x="20" y="172" class="t as" font-weight="600">MIC (built in)</text>
<polyline points="33,190 185,190" class="ls" marker-end="url(#ms)"/>
<rect x="185" y="166" width="100" height="48" class="bx"/>
<text x="235" y="186.5" class="t" font-weight="600">INPUT GAIN</text>
<text x="235" y="202.5" class="m" font-size="11">the mic's own</text>
<polyline points="285,190 310,190" class="ls" marker-end="url(#ms)"/>
<rect x="310" y="166" width="100" height="48" class="bx"/>
<text x="360" y="186.5" class="t" font-weight="600">× 5</text>
<text x="360" y="202.5" class="m" font-size="11">DC block</text>
<polyline points="410,190 435,190" class="ls" marker-end="url(#ms)"/>
<rect x="435" y="166" width="100" height="48" class="bx"/>
<text x="485" y="186.5" class="t" font-weight="600">HIGHPASS</text>
<text x="485" y="202.5" class="m" font-size="11">150 Hz, mono</text>
<polyline points="535,190 550,190 550,155 562,155" class="ls"/>
<circle cx="28" cy="290" r="5" class="b"/>
<text x="20" y="272" class="t as" font-weight="600">USB (a computer)</text>
<polyline points="33,290 185,290" class="ls" marker-end="url(#ms)"/>
<rect x="185" y="266" width="100" height="48" class="bx"/>
<text x="235" y="286.5" class="t" font-weight="600">INPUT GAIN</text>
<text x="235" y="302.5" class="m" font-size="11">USB's own</text>
<polyline points="285,290 310,290" class="ls" marker-end="url(#ms)"/>
<rect x="310" y="266" width="100" height="48" class="bx"/>
<text x="360" y="286.5" class="t" font-weight="600">× 3</text>
<text x="360" y="302.5" class="m" font-size="11">as AUX</text>
<polyline points="410,290 556,290 556,185 562,185" class="ls"/>
<circle cx="600" cy="155" r="2.5" class="b"/>
<circle cx="565" cy="125" r="2.5" class="b"/>
<circle cx="565" cy="155" r="2.5" class="b"/>
<circle cx="565" cy="185" r="2.5" class="b"/>
<path d="M600,155L569.6,132.9" class="sw"/>
<rect x="591" y="95" width="18" height="18" class="g"/>
<text x="600" y="108.5" class="gt" font-size="11" font-weight="600">A</text>
<text x="612" y="210" class="m" font-size="11">5 ms crossfade</text>
<text x="560" y="34" class="m" font-size="11">the AUX jack: a cable in picks AUX, out the mic</text>
<polyline points="583,42 583,128" class="lc" marker-end="url(#mc)"/>
<polyline points="602,155 705,155 705,332 40,332 40,400" class="la"/>
<polyline points="40,400 40,560" class="ls"/>
<circle cx="40" cy="400" r="3" class="da"/>
<polyline points="40,400 75,400" class="la"/>
<circle cx="77.5" cy="400" r="2.5" class="b"/>
<circle cx="102.5" cy="400" r="2.5" class="b"/>
<path d="M79,399L101,389" class="sw"/>
<rect x="81" y="367" width="18" height="18" class="g"/>
<text x="90" y="380.5" class="gt" font-size="11" font-weight="600">B</text>
<polyline points="105,400 157,400" class="la"/>
<circle cx="160" cy="400" r="2.5" class="b"/>
<circle cx="195" cy="375" r="2.5" class="b"/>
<circle cx="195" cy="425" r="2.5" class="b"/>
<path d="M160,400L190.1,382.5" class="sw"/>
<rect x="161" y="359" width="18" height="18" class="g"/>
<text x="170" y="372.5" class="gt" font-size="11" font-weight="600">C</text>
<polyline points="197,375 330,375" class="la" marker-end="url(#ma)"/>
<text x="263" y="368" class="m" font-size="11">through the effects</text>
<polyline points="197,425 330,425" class="ls" marker-end="url(#ms)"/>
<text x="263" y="418" class="m" font-size="11">past the effects</text>
<polyline points="40,490 200,490" class="ls" marker-end="url(#ms)"/>
<circle cx="40" cy="490" r="3" class="ds"/>
<text x="120" y="482" class="m" font-size="11">meter: VOLUME page 2</text>
<rect x="200" y="468" width="100" height="44" class="bx"/>
<text x="250" y="486.5" class="t" font-weight="600">LOOPER</text>
<text x="250" y="502.5" class="m" font-size="11">records it</text>
<polyline points="300,490 330,490" class="ls" marker-end="url(#ms)"/>
<text x="315" y="483" class="m" font-size="10">loop</text>
<polyline points="40,560 470,560" class="ls" marker-end="url(#ms)"/>
<text x="250" y="553" class="m" font-size="11">the source alone, whatever B and C say</text>
<text x="478" y="564.5" class="t as">to the phones feed (VOLUME p. 3)</text>
<rect x="330" y="355" width="140" height="157" class="bx"/>
<text x="400" y="398" class="t" font-weight="600">MIX</text>
<text x="400" y="414" class="m" font-size="11">SHIFT + VOLUME</text>
<text x="400" y="430" class="m" font-size="11"></text>
<text x="400" y="446" class="m" font-size="11">the input's share</text>
<text x="400" y="462" class="m" font-size="11">against the loop's,</text>
<text x="400" y="478" class="m" font-size="11">on both inputs</text>
<polyline points="470,385 505,385" class="la" marker-end="url(#ma)"/>
<text x="512" y="389.5" class="t as" font-weight="600">to the effects</text>
<text x="512" y="406" class="m as" font-size="11">and the finalizer</text>
<polyline points="470,455 505,455" class="ls" marker-end="url(#ms)"/>
<text x="512" y="459.5" class="t as">past the effects:</text>
<text x="512" y="476" class="m as" font-size="11">joins after the finalizer</text>
<rect x="28" y="597" width="18" height="18" class="g"/>
<text x="37" y="610.5" class="gt" font-size="11" font-weight="600">A</text>
<text x="60" y="610" class="t as" font-size="11">upper F#: the source, AUX, the mic or USB. The AUX jack picks AUX or the mic</text>
<rect x="28" y="619" width="18" height="18" class="g"/>
<text x="37" y="632.5" class="gt" font-size="11" font-weight="600">B</text>
<text x="60" y="632" class="t as" font-size="11">upper G#: monitoring, on the outputs or not</text>
<rect x="28" y="641" width="18" height="18" class="g"/>
<text x="37" y="654.5" class="gt" font-size="11" font-weight="600">C</text>
<text x="60" y="654" class="t as" font-size="11">upper A#: through the effects, or past them and the finalizer</text>
<rect x="28" y="663" width="18" height="18" class="g"/>
<text x="37" y="676.5" class="gt" font-size="11" font-weight="600">M</text>
<text x="60" y="676" class="t as" font-size="11">SHIFT + upper F#: AUX mono, its left channel to both sides</text>
<text x="28" y="704" class="m as" font-size="11">On the settings page (mode switch up). Each source keeps its own gain, B and C.</text>
</svg>
