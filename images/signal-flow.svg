<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="720" height="440" role="img" aria-labelledby="title desc">
<title id="title">FRIZZ signal flow</title>
<desc id="desc">The whole way of the sound. The input, AUX, the built-in mic or USB after its input gain, goes to the looper and to the input/loop mix; the looper's playback is the input/loop mix's other side. The input/loop mix goes through the effects of the white keys and the finalizer. A source set past the effects: the input/loop mix's input share skips the effects and the finalizer and joins after them. From there the master goes to the computer over USB, and through VOLUME, the output gain, and a safety limiter on each output: the line out, and the headphones, whose feed can blend in the input alone.</desc>
