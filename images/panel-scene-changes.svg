<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 293" width="480" height="293" role="img" aria-labelledby="title desc">
<title id="title">Scene changes in time</title>
<desc id="desc">The panel with one SHIFT hold's controls lit: the CHOMPI key (SHIFT), the scene keys 1 to 4 and the transport knob. Hold SHIFT, tap a scene key, once per bar (1 to 8), press the transport knob for a drop, turn it for the crossfader, or leave it for a morph, let go of SHIFT: the bars count from there.</desc>
