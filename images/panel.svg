<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 410" width="720" height="410" role="img" aria-labelledby="title desc">
<title id="title">FRIZZ panel</title>
<desc id="desc">A schematic of the panel, not its artwork. Front row: 15 white keys, the effects freezer, shifter, folder, crusher, filter, flanger, phaser, resonator, slicer, wow &amp; flutter, tape stop, delay, reverb, the chaos key and the finalizer. Above them 10 dark keys: the blank scene, scenes 1-4, save, copy and delete. Behind them the mode switch, the CHOMPI key (SHIFT), knobs 1-4, the transport wheel, PLAY, LOOP and VOLUME. Jacks: MIDI in and out on the left, AUX in and the headphones on the right, USB-C, the microSD card and the line out at the back.</desc>
