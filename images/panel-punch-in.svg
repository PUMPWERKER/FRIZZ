<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 313" width="480" height="313" role="img" aria-labelledby="title desc">
<title id="title">Playing an effect</title>
<desc id="desc">The panel with what plays an effect lit: the white keys 1 to 14 in their effects' colours, the CHOMPI key (SHIFT) and knobs 1 to 4. Hold a white key: its effect is on while you hold it. Hold the key, then SHIFT: latched on, or off again. SHIFT first, then the key: selected for the knobs, unheard. Turn: the effect's sound. SHIFT + turn: in big steps. Press: its page 2 and back. SHIFT + press: the default.</desc>
