<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 84" width="480" height="84" role="img" aria-labelledby="title desc">
<title id="title">Reverb: white key 13</title>
<desc id="desc">The keys from above: the reverb is white key 13 of 15, counted from the left, lit in its colour. Its knobs 1 to 4 are Decay, Diffusion, Tone, Ducking; their LEDs go from one colour to the other.</desc>
