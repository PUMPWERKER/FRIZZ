<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 450" width="480" height="450" role="img" aria-labelledby="title desc">
<title id="title">How the sound flows</title>
<desc id="desc">The input, AUX, the built-in mic or USB after its input gain, goes two ways: to the looper, which records it before the effects, so nothing is printed into the loop; and, if monitored (the mic starts off), on to the input/loop mix, SHIFT + VOLUME, where the loop joins it. From there input and loop alike go through the effects (white keys 1-14), the finalizer (white key 15) and VOLUME, the output gain, to the line out and the headphones.</desc>
<style>svg{font-size:12px}text{font-family:'IBM Plex Mono', ui-monospace, Menlo, monospace;fill:#EEEBE3;text-anchor:middle}.as{text-anchor:start}.ae{text-anchor:end}.m{fill:#A9A49A}.gt{fill:#1B1B19}.b{fill:none;stroke:#A9A49A;stroke-width:1.5}.bx{fill:none;stroke:#A9A49A;stroke-width:2}.ba{fill:#26261F;stroke:#EEEBE3;stroke-width:2}.la{fill:none;stroke:#EEEBE3;stroke-width:2}.ls{fill:none;stroke:#A9A49A;stroke-width:2}.lc{fill:none;stroke:#77736B;stroke-width:1.5;stroke-dasharray:5 4}.da{fill:#EEEBE3}.ds{fill:#A9A49A}.sw{stroke:#EEEBE3;stroke-width:2}.g{fill:#EEEBE3}.j{fill:#A9A49A}.wk{fill:#EEEBE3;stroke:#1B1B19;stroke-width:1.5}.dk{fill:#26261F;stroke:#A9A49A;stroke-width:1.5}.sk{fill:#A9A49A;stroke:#1B1B19;stroke-width:1.5}.led{fill:none;stroke:#A9A49A;stroke-width:1.5}</style>
<defs><marker id="ma" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0L10,5L0,10z" fill="#EEEBE3"/></marker><marker id="ms" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0L10,5L0,10z" fill="#A9A49A"/></marker><marker id="mc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0L10,5L0,10z" fill="#77736B"/></marker></defs>
<rect width="480" height="450" fill="#1B1B19"/>
<rect x="50" y="20" width="200" height="60" class="ba"/>
<text x="150" y="38.5" class="t" font-weight="600">INPUT</text>
<text x="150" y="54.5" class="m" font-size="11">AUX, the mic or USB</text>
<text x="150" y="70.5" class="m" font-size="11">input gain</text>
<polyline points="150,80 150,212" class="la" marker-end="url(#ma)"/>
<circle cx="150" cy="100" r="3" class="da"/>
<polyline points="150,100 375,100 375,116" class="ls" marker-end="url(#ms)"/>
<text x="262" y="92" class="m" font-size="11">the input</text>
<rect x="290" y="116" width="170" height="80" class="bx"/>
<text x="375" y="136.5" class="t" font-weight="600">LOOPER</text>
<text x="375" y="152.5" class="m" font-size="11">records here, before</text>
<text x="375" y="168.5" class="m" font-size="11">the effects: nothing is</text>
<text x="375" y="184.5" class="m" font-size="11">printed into the loop</text>
<text x="142" y="150" class="t ae" font-size="11">if monitored</text>
<text x="142" y="166" class="m ae" font-size="10">the mic: off at first</text>
<rect x="50" y="212" width="200" height="60" class="bx"/>
<text x="150" y="230.5" class="t" font-weight="600">MIX</text>
<text x="150" y="246.5" class="m" font-size="11">input ↔ loop</text>
<text x="150" y="262.5" class="m" font-size="11">SHIFT + VOLUME</text>
<polyline points="375,196 375,242 250,242" class="ls" marker-end="url(#ms)"/>
<text x="312" y="235" class="m" font-size="11">loop</text>
<polyline points="150,272 150,292" class="la" marker-end="url(#ma)"/>
<rect x="50" y="292" width="200" height="60" class="ba"/>
<text x="150" y="310.5" class="t" font-weight="600">EFFECTS</text>
<text x="150" y="326.5" class="m" font-size="11">white keys 1–14,</text>
<text x="150" y="342.5" class="m" font-size="11">on input and loop alike</text>
<polyline points="150,352 150,372" class="la" marker-end="url(#ma)"/>
<rect x="80" y="372" width="140" height="48" class="ba"/>
<text x="150" y="392.5" class="t" font-weight="600">FINALIZER</text>
<text x="150" y="408.5" class="m" font-size="11">white key 15</text>
<polyline points="220,396 240,396" class="la" marker-end="url(#ma)"/>
<rect x="240" y="372" width="110" height="48" class="ba"/>
<text x="295" y="392.5" class="t" font-weight="600">VOLUME</text>
<text x="295" y="408.5" class="m" font-size="11">output gain</text>
<polyline points="350,396 385,396" class="la" marker-end="url(#ma)"/>
<circle cx="392" cy="396" r="5" class="b"/>
<text x="404" y="400.5" class="t as" font-weight="600">OUT</text>
<text x="404" y="416" class="m as" font-size="11">line out,</text>
<text x="404" y="431" class="m as" font-size="11">phones</text>
</svg>
