<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 293" width="480" height="293" role="img" aria-labelledby="title desc">
<title id="title">The looper</title>
<desc id="desc">The panel with the looper's controls lit: LOOP, PLAY, the transport knob and the CHOMPI key (SHIFT). LOOP: record; again, stop and play; again, erase. PLAY: play or pause, when you let go. Hold PLAY, press LOOP: record in time, or erase at the end. The transport knob: turn for speed, press for 1×. SHIFT + LOOP: tap the tempo.</desc>
