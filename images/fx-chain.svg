<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 830" width="720" height="830" role="img" aria-labelledby="title desc">
<title id="title">FRIZZ effects chain</title>
<desc id="desc">The order FRIZZ computes the effects in. From the input/loop mix: the freezer (key 1), then the shifter, folder, crusher, filter, flanger and phaser (keys 2-7), which sit inside the resonator's feedback loop (key 8): it taps the signal after the phaser and feeds its ringing back in after the freezer. Then the slicer, wow &amp; flutter and the tape stop (keys 9-11). The delay (key 12) and the reverb (key 13) are sends: the key fades what goes in, page 2's Band filters it, Level sets the return, which is added to the signal; the reverb gets the delay's echoes too. The keys and knobs come from the panel, MIDI and scene morphs; the chaos key (14) drops latched effects and scrambles the loop. After the effects the finalizer (key 15); then the input past the effects joins, then VOLUME and a safety limiter on the line out and on the headphones, whose feed blends towards the input alone. Below: every insert's page 2, Band, Level and Mix.</desc>
